name: Test and build Windows app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install --no-build-isolation -e .
      - name: Python tests (no game collection)
        run: python -m unittest discover -s tests -v
      - name: Browser logic tests
        run: |
          node tests/test_i18n.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_player_ui.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_refresh_ui.cjs
      - name: Build local artifacts
        run: python scripts/build.py
      - name: Packaged app and offline service check
        run: python scripts/verify_package.py
      - uses: actions/upload-artifact@v7
        with:
          name: aion2-redbag-map-windows
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
