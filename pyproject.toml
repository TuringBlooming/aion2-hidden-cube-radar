[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "aion2-hidden-cube-radar"
version = "1.5.0"
description = "A free community accessibility radar for AION2 Hidden Cube visual alerts and local observations"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["Pillow==13.0.0"]

[project.gui-scripts]
aion2-hidden-cube-radar = "aion2_redbag_map.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aion2_redbag_map = ["maps.json", "map-source.json", "static/*.html", "static/*.css", "static/*.js", "static/*.json", "static/*.wav", "static/maps/*.webp", "static/maps/*/*.webp"]
